<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>It's Time - 定时播放 不被忽略 | macOS 原生极简定时助手</title>
  <meta name="description" content="专为打破久坐打造的 macOS 定时助手。到了时间，自动播放八段锦或眼保健操。">
  <link rel="icon" type="image/png" href="assets/icon.png">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #fbfbfd;
      --border: rgba(0, 0, 0, 0.06);
      --border-hover: rgba(0, 0, 0, 0.14);
      --text-main: #1d1d1f;
      --text-sub: #86868b;
      --nav-glass: rgba(255, 255, 255, 0.82);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* 顶部导航 */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: var(--nav-glass);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      display: flex;
      align-items: center;
    }

    .nav-container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text-main);
      font-weight: 600;
      font-size: 14px;
    }

    .brand img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-actions a {
      color: var(--text-sub);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-actions a:hover {
      color: var(--text-main);
    }

    .btn-nav {
      background: var(--text-main);
      color: #ffffff !important;
      font-size: 12px;
      font-weight: 500;
      padding: 5px 14px;
      border-radius: 980px;
      transition: opacity 0.2s;
    }

    .btn-nav:hover {
      opacity: 0.85;
    }

    /* 容器 */
    .container {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* 按钮 */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #000000;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      padding: 13px 28px;
      border-radius: 980px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.85;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.04);
      color: var(--text-main);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      padding: 13px 26px;
      border-radius: 980px;
      transition: background 0.2s;
    }

    .btn-secondary:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    /* Hero */
    .hero {
      padding-top: 140px;
      padding-bottom: 70px;
      text-align: center;
    }

    /* 主标题：无标点 */
    .hero-title {
      font-size: clamp(38px, 6.5vw, 70px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.1;
      margin-bottom: 20px;
      color: var(--text-main);
    }

    /* It's Time to [固定下划线 + 应用图标 + 纯黑文字 + 灰色图标] */
    .ticker-bar-fixed {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: clamp(18px, 2.6vw, 24px);
      font-weight: 600;
      margin-bottom: 40px;
      letter-spacing: -0.015em;
    }

    .ticker-app-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
      margin-right: 10px;
      flex-shrink: 0;
    }

    .ticker-label-fixed {
      color: #1d1d1f; /* 字体颜色更黑，清晰醒目 */
      font-weight: 600;
      white-space: nowrap;
      margin-right: 10px;
    }

    .ticker-target-slot {
      position: relative;
      width: 170px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start; /* 左对齐，不居中 */
      padding-left: 2px;
    }

    /* 绝对固定宽度的下划线 */
    .ticker-underline-fixed {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background-color: var(--text-main);
      border-radius: 1px;
    }

    /* 轮播内容组：纯黑字 + 后面灰色图标 */
    .ticker-group {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--text-main);
      font-weight: 600;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .ticker-group.fade-out {
      opacity: 0;
      transform: translateY(-4px);
    }

    .ticker-group.fade-in {
      opacity: 1;
      transform: translateY(0);
    }

    .ticker-icon {
      display: inline-flex;
      align-items: center;
      color: var(--text-sub); /* 优雅中灰色图标 */
    }

    .hero-subtitle {
      font-size: clamp(16px, 2.2vw, 20px);
      color: var(--text-sub);
      max-width: 580px;
      margin: 0 auto 36px;
      line-height: 1.55;
      font-weight: 400;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 64px;
    }

    /* 样机展示区 */
    .mockup-container {
      max-width: 1040px;
      margin: 0 auto;
      text-align: center;
    }

    .mockup-container img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* 三个核心卖点卡片 (根据 README) */
    .features {
      padding: 90px 0;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .feature-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 36px 30px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: border-color 0.2s;
    }

    .feature-card:hover {
      border-color: var(--border-hover);
    }

    .feature-title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .feature-desc {
      font-size: 15px;
      color: var(--text-sub);
      line-height: 1.6;
    }

    /* 极简页脚 */
    footer {
      border-top: 1px solid var(--border);
      padding: 40px 0;
      font-size: 12px;
      color: var(--text-sub);
    }

    .footer-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-links {
      display: flex;
      gap: 20px;
    }

    .footer-links a {
      color: var(--text-sub);
      text-decoration: none;
    }

    .footer-links a:hover {
      color: var(--text-main);
    }

    @media (max-width: 768px) {
      .features-grid {
        grid-template-columns: 1fr;
      }
      .hero {
        padding-top: 100px;
      }
      .ticker-bar-fixed {
        font-size: 17px;
      }
      .ticker-target-slot {
        width: 145px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ticker-group {
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部极简毛玻璃导航 -->
  <header>
    <div class="nav-container">
      <a href="#" class="brand">
        <img src="assets/icon.png" alt="It's Time 图标">
        <span>It's Time</span>
      </a>
      <div class="nav-actions">
        <a href="https://github.com/simpfly/its-time-mac" target="_blank">GitHub</a>
        <a href="https://github.com/simpfly/its-time-mac/releases" class="btn-nav">免费下载</a>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero 核心展示 -->
    <section class="hero container">
      <!-- 主标题：无标点 -->
      <h1 class="hero-title">
        定时播放 不被忽略
      </h1>

      <!-- It's Time to [应用图标 + 更黑字体 + 固定下划线 + 文字后方灰色图标 + 左对齐] -->
      <div class="ticker-bar-fixed">
        <img src="assets/icon.png" alt="It's Time 图标" class="ticker-app-icon">
        <span class="ticker-label-fixed">It's Time to</span>
        <div class="ticker-target-slot">
          <div id="tickerGroup" class="ticker-group">
            <span id="tickerText">做眼保健操</span>
            <span id="tickerIcon" class="ticker-icon">
              <!-- 眼保健操初始图标 -->
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </span>
          </div>
          <!-- 长度固定的下划线 -->
          <div class="ticker-underline-fixed"></div>
        </div>
      </div>

      <div class="hero-actions">
        <a href="https://github.com/simpfly/its-time-mac/releases" class="btn-primary">
          下载 macOS 版
        </a>
        <a href="https://github.com/simpfly/its-time-mac" target="_blank" class="btn-secondary">
          查看源码
        </a>
      </div>

      <!-- MacBook 实机界面展示 -->
      <div class="mockup-container">
        <img src="assets/screenshots/hero-preview.jpg?v=20261124" alt="It's Time 实机界面展示">
      </div>
    </section>

    <!-- 三个核心卖点卡片 (阅读 README 提炼) -->
    <section class="features container">
      <div class="features-grid">
        <div class="feature-card">
          <h3 class="feature-title">自然语言快速创建</h3>
          <p class="feature-desc">
            输入“每45分钟做眼保健操”或“半小时后提醒我”，自动识别时间并填入，回车即启动。
          </p>
        </div>

        <div class="feature-card">
          <h3 class="feature-title">菜单栏常驻与全天时间轴</h3>
          <p class="feature-desc">
            零 Dock 占用，图标实时显示倒计时；内嵌彩色时间轴，全天任务分布与剩余时间一眼看清。
          </p>
        </div>

        <div class="feature-card">
          <h3 class="feature-title">锁屏与休眠智能跳过</h3>
          <p class="feature-desc">
            音频触发前 5 秒可跳过；锁屏、息屏或合盖立即停止，唤醒后绝不补发错过的提醒，不打扰。
          </p>
        </div>
      </div>
    </section>
  </main>

  <!-- 极简页脚 -->
  <footer>
    <div class="container footer-content">
      <div>
        It's Time · 适用于 macOS 13+ · 基于 MIT 协议开源
      </div>
      <div class="footer-links">
        <a href="https://github.com/simpfly/its-time-mac" target="_blank">GitHub 仓库</a>
        <a href="https://github.com/simpfly/its-time-mac/releases" target="_blank">Releases</a>
      </div>
    </div>
  </footer>

  <script>
    // 轮播事项配置（纯黑字 + 相应灰色 SVG 图标）
    const tasks = [
      {
        text: '做眼保健操',
        icon: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>'
      },
      {
        text: '练八段锦',
        icon: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"></circle><path d="m9 20 3-6 3 6"></path><path d="m6 8 6 2 6-2"></path><path d="M12 10v4"></path></svg>'
      },
      {
        text: '喝杯水',
        icon: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>'
      },
      {
        text: '站起来活动',
        icon: '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4" r="2"></circle><path d="m15 22-3-7-3 7"></path><path d="M9 13V9l3 2 3-2v4"></path></svg>'
      }
    ];

    let currentIndex = 0;
    const tickerGroup = document.getElementById('tickerGroup');
    const tickerText = document.getElementById('tickerText');
    const tickerIcon = document.getElementById('tickerIcon');

    function rotateTask() {
      if (!tickerGroup) return;
      tickerGroup.classList.remove('fade-in');
      tickerGroup.classList.add('fade-out');

      setTimeout(() => {
        currentIndex = (currentIndex + 1) % tasks.length;
        tickerText.textContent = tasks[currentIndex].text;
        tickerIcon.innerHTML = tasks[currentIndex].icon;
        tickerGroup.classList.remove('fade-out');
        tickerGroup.classList.add('fade-in');
      }, 200);
    }

    // 每 2.8 秒平滑切换一次
    setInterval(rotateTask, 2800);
  </script>
</body>
</html>
