.copy{position:absolute;left:128px;top:50%;width:655px;transform:translateY(-50%)}
h1,h2,p{margin:0}h1,h2{font-weight:760;line-height:1.12;letter-spacing:-.045em}
h1{font-size:108px}h2{font-size:92px}.copy p{font-size:35px;line-height:1.5;margin-top:28px;color:#526079}.night .copy p{color:#bac7df}

.timer{height:676px;width:676px;position:absolute;right:154px;top:202px}
.timer svg{position:absolute;inset:0;width:100%;height:100%}
.readout{position:absolute;inset:0;display:grid;place-content:center;font:700 152px/1 ui-monospace,monospace;letter-spacing:-12px;font-variant-numeric:tabular-nums}
.panel{position:absolute;right:128px;top:246px;width:920px;padding:42px;background:#fff;border:1px solid #cdd8eb;border-radius:40px;box-shadow:0 35px 95px #15234325}

.caret{color:#0754e8;font-weight:300}
.result{margin-top:24px;border-top:1px solid #dce5f6;display:flex;align-items:center;justify-content:space-between;padding:28px 2px 0;font-size:36px;color:#30415f}
.result strong{font:700 75px/1 ui-monospace,monospace;letter-spacing:-4px;color:#0754e8}
.start{display:inline-block;margin-top:28px;background:#0754e8;color:white;padding:18px 30px;border-radius:16px;font-size:31px;font-weight:650}
.appshot{position:absolute;object-fit:cover;border-radius:24px;box-shadow:0 25px 70px #0c1b394a;border:1px solid #7b97ba70}
.mainshot{width:865px;height:auto;right:140px;top:122px}
.menushot{width:392px;height:auto;right:108px;top:440px}
.desktop{width:895px;height:auto;right:128px;top:247px}
.night .appshot{border-color:#adbfdd5c;box-shadow:0 25px 72px #060b16ad}
.skip{position:absolute;right:155px;top:190px;background:#173660;color:#dfeaff;border:1px solid #416ca7;border-radius:50px;padding:17px 28px;font-size:28px;font-weight:650}
.end{position:absolute;inset:0;display:grid;place-content:center;text-align:center;justify-items:center}
.end .stamp{width:174px;height:174px;margin-bottom:32px}.end h2{font-size:124px}.end p{font-size:40px;margin-top:24px}
.cta{margin-top:42px;background:#0754e8;color:white;border-radius:50px;padding:19px 32px;font-size:28px;font-weight:700}
.address{margin-top:18px;font:500 30px ui-monospace,monospace;color:#42536e}
</style>
</head>
<body>
<main data-hf-id="hf-7nj2" id="root" data-composition-id="its-time-launch" data-width="1920" data-height="1080" data-duration="30" data-fps="30">
  <section data-hf-id="hf-jzum" id="hook" class="scene clip paper" data-start="0" data-duration="5" data-track-index="0">
    <div data-hf-id="hf-bdx3" class="copy"><img data-hf-id="hf-quwe" class="stamp" src="assets/icon.png" alt=""><h1 data-hf-id="hf-el1u">下一件事，<br data-hf-id="hf-x5px"><span data-hf-id="hf-14p8" class="blue">到点再想。</span></h1></div>
    <div data-hf-id="hf-ee2o" class="timer" aria-hidden="true">
      <svg data-hf-id="hf-rwnt" viewBox="0 0 676 676"><circle data-hf-id="hf-mcmj" cx="338" cy="338" r="285" fill="#f8faff" stroke="#d0dcf3" stroke-width="15"/><circle data-hf-id="hf-tnwa" id="progress" cx="338" cy="338" r="285" fill="none" stroke="#0754e8" stroke-width="17" stroke-linecap="round" stroke-dasharray="1390 1791" transform="rotate(-90 338 338)"/><circle data-hf-id="hf-2sin" cx="338" cy="53" r="8.5" fill="#0754e8"/></svg>
      <div data-hf-id="hf-oqh5" class="readout">25:00</div>
    </div>
  </section>
  <section data-hf-id="hf-su0i" id="create" class="scene clip night" data-start="5" data-duration="7" data-track-index="0">
    <div data-hf-id="hf-r8s7" class="copy"><h2 data-hf-id="hf-aa6i">打一句话，<br data-hf-id="hf-rsrt"><span data-hf-id="hf-rvzb" class="blue">开始计时。</span></h2><p data-hf-id="hf-7lqi">自动识别时间，按回车启动。</p></div>
    <div data-hf-id="hf-owjm" class="panel">
      <div data-hf-id="hf-0ztw" class="field"><span data-hf-id="hf-jk7q" id="typed"></span><span data-hf-id="hf-aplz" class="caret">▏</span></div>
      <div data-hf-id="hf-ycrv" class="result"><span data-hf-id="hf-lwlm">倒计时</span><strong data-hf-id="hf-wue7">25:00</strong></div>
      <span data-hf-id="hf-nqz5" class="start">↵&nbsp; 启动</span>
    </div>
  </section>
  <section data-hf-id="hf-cjkx" id="overview" class="scene clip paper" data-start="12" data-duration="7" data-track-index="0">

    <img data-hf-id="hf-dupm" class="appshot mainshot" src="assets/main-window.png" alt="It's Time 主窗口与全天时间轴">
    <img data-hf-id="hf-15tm" class="appshot menushot" src="assets/menubar-panel.png" alt="It's Time 菜单栏面板">
  </section>

    <img data-hf-id="hf-fjzr" class="appshot desktop" src="assets/real-desktop.jpg" alt="桌面上的 It's Time 菜单栏面板">
    <div data-hf-id="hf-ut12" class="skip">已跳过本次提醒</div>
  </section>
  <section data-hf-id="hf-x0rz" id="brand" class="scene clip paper" data-start="25" data-duration="5" data-track-index="0">
    <div data-hf-id="hf-zh6v" class="end"><img data-hf-id="hf-ek8i" class="stamp" src="assets/icon.png" alt=""><h2 data-hf-id="hf-xazx">It's Time</h2><p data-hf-id="hf-83pc">macOS 菜单栏定时助手</p><div data-hf-id="hf-fc01" class="cta">免费下载 · macOS 13+</div><div data-hf-id="hf-4ius" class="address">github.com/simpfly/its-time-mac</div></div>
  </section>
  <audio data-hf-id="hf-3crz" id="score" src="assets/score.wav" data-start="0" data-duration="30" data-track-index="1"></audio>
</main>
<script>
const motion = [];
function animate(selector, start, duration, frames, easing = "cubic-bezier(.2,.75,.22,1)") {
  for (const element of document.querySelectorAll(selector)) {
    const animation = element.animate(frames, { delay: start * 1000, duration: duration * 1000, fill: "both", easing });
    animation.pause();
    motion.push(animation);
  }
}
function rise(selector, start, distance = 34) {
  animate(selector, start, .65, [{ opacity: 0, translate: "0 " + distance + "px" }, { opacity: 1, translate: "0 0" }]);
}

rise(".timer", .1, 18);
animate("#progress", .25, 4.75, [{ strokeDashoffset: 250 }, { strokeDashoffset: 630 }], "linear");
rise("#create h2", 5.03);
rise("#create p", 5.36);
rise(".panel", 5.15);
rise(".result", 8.28, 16);
rise(".start", 8.7, 12);
animate(".start", 10.05, .32, [{ scale: 1 }, { scale: .94 }, { scale: 1 }]);
rise("#overview h2", 12.03);
rise("#overview p", 12.35);
animate(".mainshot", 12.1, .72, [{ opacity: 0, translate: "82px 0" }, { opacity: 1, translate: "0 0" }]);
rise(".menushot", 13.4, 64);
animate(".mainshot", 12.9, 6.1, [{ scale: 1 }, { scale: 1.04 }], "linear");
rise("#skip h2", 19.03);
rise("#skip p", 19.3);
rise(".desktop", 19.14);
rise(".skip", 20.65, -18);
animate(".desktop", 20, 5, [{ scale: 1 }, { scale: 1.04 }], "linear");
rise(".end .stamp", 25.05, 18);
rise(".end h2", 25.18, 18);
rise(".end p", 25.36, 18);
rise(".cta", 25.75, 14);
rise(".address", 25.92, 12);

const example = Array.from("25分钟后提醒我休息");
const typed = document.getElementById("typed");
const createdTimer = document.querySelector(".result strong");
const startButton = document.querySelector(".start");
const readout = document.querySelector(".readout");
const scenes = Array.from(document.querySelectorAll(".scene"));
const duration = 30;
let current = 0;
function draw(time) {
  time = Number(time);
  if (!Number.isFinite(time)) return;
  time = Math.min(duration - .0001, Math.max(0, time));
  current = time;
  motion.forEach(animation => { animation.currentTime = time * 1000; });
  for (const scene of scenes) {
    const start = Number(scene.dataset.start);
    scene.style.visibility = time >= start && time < start + Number(scene.dataset.duration) ? "visible" : "hidden";
  }
  const count = Math.max(0, Math.min(example.length, Math.floor((time - 5.94) / .19)));
  const text = example.slice(0, count).join("");
  if (typed.textContent !== text) typed.textContent = text;
  createdTimer.textContent = time >= 11.05 ? "24:59" : "25:00";
  startButton.textContent = time >= 10.2 ? "计时中" : "↵  启动";
  const seconds = 1500 - Math.floor(Math.max(0, Math.min(4, time)));
  readout.textContent = Math.floor(seconds / 60) + ":" + String(seconds % 60).padStart(2, "0");
}
window.__timelines = window.__timelines || {};
window.__timelines["its-time-launch"] = {
  seek(time) { draw(time); return this; },
  time(value) { if (value === undefined) return current; draw(value); return this; },
  totalTime(value) { return this.time(value); },
  getChildren() { return []; },
  globalTime(time) { return time; },
  duration() { return duration; },
  totalDuration() { return duration; },
  pause() { return this; }
};
draw(0);
</script>
</body>
